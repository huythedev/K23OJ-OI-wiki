name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # OI-wiki defaults to 'master', not 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for 'git-revision-date-localized-plugin' to work
          submodules: true # Required if your theme is a git submodule

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # OI-wiki typically relies on Python 3.10 features

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install dependencies from requirements.txt (Standard OI-wiki method)
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Fallback if requirements.txt is missing
            pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-static-i18n
          fi

      # Some OI-wiki forks require a pre-build script to fetch assets/themes
      - name: Run Pre-build Script (if exists)
        run: |
          if [ -f scripts/pre-build/pre-build.sh ]; then
            chmod +x scripts/pre-build/pre-build.sh
            ./scripts/pre-build/pre-build.sh
          fi

      - name: Build site
        run: mkdocs build -v

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true # Keeps the gh-pages branch clean/small
