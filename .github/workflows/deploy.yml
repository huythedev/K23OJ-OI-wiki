name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # --- Step 1: Setup Node.js (Required for MathJax/TypeScript scripts) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          npm install -g ts-node typescript
          if [ -f package.json ]; then npm install; fi

      # --- Step 2: Setup Python & Install Dependencies ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 📦 Full install list based on your local environment
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-toggle-sidebar-plugin \
            python-markdown-document-offsets-injection-extension \
            pymdown-extensions \
            pyyaml-env-tag \
            mkdocs-static-i18n \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin \
            mkdocs-redirects \
            ghp-import \
            beautifulsoup4 \
            mergedeep \
            pygments \
            requests \
            jinja2 \
            pyyaml \
            watchdog \
            markdown \
            click \
            packaging \
            platformdirs

          # Fallback to requirements.txt if it exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Step 3: Run Scripts & Deploy ---
      - name: Run Pre-build Script
        run: |
          if [ -f scripts/pre-build/pre-build.sh ]; then
            chmod +x scripts/pre-build/pre-build.sh
            ./scripts/pre-build/pre-build.sh
          fi

      - name: Build site
        run: mkdocs build -v

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          cname: oi-wiki.k23oj.io.vn
