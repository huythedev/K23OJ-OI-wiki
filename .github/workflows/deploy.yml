name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # NEW STEP: Set up Node.js (Required for the pre-build script)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NEW STEP: Install Node dependencies (Fixes 'ts-node' error)
      - name: Install Node dependencies
        run: |
          npm install -g ts-node typescript
          if [ -f package.json ]; then npm install; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-static-i18n
          fi

      - name: Run Pre-build Script
        run: |
          if [ -f scripts/pre-build/pre-build.sh ]; then
            chmod +x scripts/pre-build/pre-build.sh
            # We explicitly call the script, ensuring it runs in the environment we just set up
            ./scripts/pre-build/pre-build.sh
          fi

      - name: Build site
        run: mkdocs build -v

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
