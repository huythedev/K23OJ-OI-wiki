name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # --- Step 1: Node.js (for math scripts) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          npm install -g ts-node typescript
          if [ -f package.json ]; then npm install; fi

      # --- Step 2: Python (for MkDocs) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # ⚠️ INSTALL EVERYTHING: We force install all common OI-wiki plugins here
          # This covers minify, redirects, and the specific extensions you need.
          pip install \
            mkdocs-material \
            mkdocs-static-i18n \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin \
            mkdocs-redirects \
            python-markdown-document-offsets-injection-extension

          # If the repo has a requirements.txt, run it last to catch anything else
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Step 3: Build & Deploy ---
      - name: Run Pre-build Script
        run: |
          if [ -f scripts/pre-build/pre-build.sh ]; then
            chmod +x scripts/pre-build/pre-build.sh
            ./scripts/pre-build/pre-build.sh
          fi

      - name: Build site
        run: mkdocs build -v

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
